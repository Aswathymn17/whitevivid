<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - WHITE VIVID HOMESTAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding-top: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
    }

    .gallery-wrapper {
      max-width: 950px;
      margin: 40px auto;
      background: #f4f4f4;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .gallery-topbar {
      background: #3a3033;
      color: #fff;
      padding: 18px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gallery-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
    }

    .gallery-nav-left,
    .gallery-nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
      opacity: 0.9;
    }

    .gallery-brand {
      font-weight: 700;
      letter-spacing: 0.08rem;
      color: #d6f0e1;
    }

    .gallery-hero {
      text-align: center;
      padding: 36px 20px 30px;
      color: #fff;
      background: #3a3033;
    }

    .gallery-hero h1 {
      margin: 0;
      font-size: 2rem;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .gallery-hero p {
      margin: 8px 0 0;
      font-size: 0.75rem;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .gallery-content {
      padding: 45px 60px 50px;
      background: #f3f3f3;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 0 auto;
    }

    .gallery-item {
      overflow: hidden;
      background: #ddd;
      min-height: 78px;
      border: 4px solid #ffffff;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    .item-large {
      grid-column: 2 / 4;
      grid-row: 1 / 3;
      min-height: 170px;
    }

    .item-tall {
      grid-row: span 2;
      min-height: 160px;
    }

    .gallery-btn-wrap {
      text-align: center;
      margin-top: 24px;
    }

    .gallery-btn {
      border: 1px solid #84b79b;
      background: #84b79b;
      color: #fff;
      font-size: 0.68rem;
      letter-spacing: 0.16rem;
      text-transform: uppercase;
      padding: 7px 16px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .gallery-content {
        padding: 30px 24px;
      }
    }

    @media (max-width: 700px) {
      .gallery-wrapper {
        margin: 0;
      }

      .gallery-content {
        padding: 20px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .item-large {
        grid-column: span 2;
        grid-row: auto;
      }

      .item-tall {
        grid-row: auto;
      }

      .gallery-nav {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

<div class="gallery-wrapper">
  <div class="gallery-topbar">
    <div class="gallery-nav">
      <div class="gallery-nav-left">
        <span class="gallery-brand">White Vivid</span>
        <span>Home</span>
        <span>About</span>
        <span>Gallery</span>
        <span>Contact</span>
      </div>
      <div class="gallery-nav-right">
        <span>Login</span>
        <span>Book</span>
      </div>
    </div>
  </div>

  <div class="gallery-hero">
    <h1>Gallery Page</h1>
    <p>White Vivid</p>
  </div>

  <div class="gallery-content">
    <div class="gallery-grid">
      <div class="gallery-item"><img src="static/images/img1.jpg.jpeg" alt="Gallery 1" /></div>
      <div class="gallery-item item-large"><img src="static/images/Charlie kulam new.jpg" alt="Gallery 2" /></div>
      <div class="gallery-item"><img src="static/images/img2.jpg.jpeg" alt="Gallery 3" /></div>
      <div class="gallery-item item-tall"><img src="static/images/IMG_20250722_161325_077.jpg" alt="Gallery 4" /></div>
      <div class="gallery-item"><img src="static/images/img3.jpg.jpg" alt="Gallery 5" /></div>
      <div class="gallery-item"><img src="static/images/img4.jpeg" alt="Gallery 6" /></div>
      <div class="gallery-item"><img src="static/images/img5.jpeg" alt="Gallery 7" /></div>
      <div class="gallery-item"><img src="static/images/img6.jpeg" alt="Gallery 8" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161325_196.jpg" alt="Gallery 9" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161325_450.jpg" alt="Gallery 10" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161325_469.jpg" alt="Gallery 11" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161325_470.jpg" alt="Gallery 12" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161325_548.jpg" alt="Gallery 13" /></div>
      <div class="gallery-item"><img src="static/images/IMG_20250722_161326_050.jpg" alt="Gallery 14" /></div>
    </div>
    <div class="gallery-btn-wrap">
      <button class="gallery-btn" type="button">Load More</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
